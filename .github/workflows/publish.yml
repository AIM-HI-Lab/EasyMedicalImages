name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    name: Build & import (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Install the built wheel and import it
        shell: bash
        run: |
          pip install dist/*.whl
          python -c "import EasyMedicalImages; print('ok on ${{ matrix.os }}')"

  publish:
    name: Publish to PyPI
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
