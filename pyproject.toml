[build-system]
requires = ["scikit-build-core>=0.12.2", "pybind11>=3.0", "ninja"]
build-backend = "scikit_build_core.build"

[project]
name = "easy-medical-images"
version = "1.1.1"
description = "The easy way to manipulate medical images."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "AIM-HI-LAB" }]
dependencies = [
    "numpy>=2.4.6",
    "nibabel>=5.4.2",
    "nilearn>=0.13.1",
    "scipy>=1.17.1",
    "matplotlib>=3.10.9",
    "pydicom>=3.0.2",
    "tqdm>=4.67.3",
    "SimpleITK>=2.5.5"
    # add anything else your imports use, e.g. "scipy", "pydicom"
]

classifiers=[
    #Language/OS
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python",
    "Programming Language :: C++",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",

    #Free-threading (PEP 703+)
    #    "Programming Language :: Python :: Free Threading",
    "Programming Language :: Python :: Free Threading :: 1 - Unstable",

    #Maturity
    "Development Status :: 5 - Production/Stable",

    #Audiance
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",

    #What it can be used for (topics)
    "Topic :: Database",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Processing",

    #What its designed (but not required) to be used with (ecosystem)
#    "Framework :: Matplotlib"
]

[tool.setuptools.packages.find]
include = ["EasyMedicalImages*"]

[tool.scikit-build]
minimum-version = "0.12.2"
wheel.packages = ["EasyMedicalImages"]
sdist.exclude = ["SlurmTest"]
wheel.exclude = ["SlurmTest/**"]
build-dir = "build/{wheel_tag}"
editable.rebuild = true
editable.verbose = true

[tool.scikit-build.cmake]
args = ["-G", "Ninja"]

[tool.cibuildwheel]
build = ["cp312-*", "cp313-*", "cp314-*"]
skip = ["*-musllinux*"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]

[tool.cibuildwheel.macos.environment]
MACOSX_DEPLOYMENT_TARGET = "10.15"